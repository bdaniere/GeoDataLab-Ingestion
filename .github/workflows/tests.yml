name: Tests Python

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geodatalab_test
          POSTGRES_USER: geodatalab_test
          POSTGRES_PASSWORD: geodatalab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geodatalab_test -d geodatalab_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGIS_DSN: "host=127.0.0.1 port=5432 dbname=geodatalab_test user=geodatalab_test password=geodatalab_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project and test dependencies
        run: uv sync --locked --group dev

      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - name: Run tests
        run: uv run --no-sync pytest
