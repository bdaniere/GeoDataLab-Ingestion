[project]
name = "geodatalab-ingestion"
version = "0.1.0"
description = "Geospatial data ingestion library for GeoDataLab"
authors = [{ name = "bdaniere", email = "benjamin.daniere@gmail.com" }]
requires-python = "~=3.13.0"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "geopandas>=1.1.4,<2",
    "sqlalchemy>=2.1.6,<3",
    "psycopg2-binary>=2.9.13,<3",
    "geoalchemy2>=0.20.0,<0.21",
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.4,<2",
    "py7zr>=1.0.0,<2",
    "pandas>=3.1.0,<4",
    "openpyxl>=3.1.5,<4",
    "xlrd>=2.0.2,<3",
    "pyyaml>=6.0.3,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.sdist]
include = ["src/geodatalab_ingestion"]

[tool.hatch.build.targets.wheel]
include = ["src/geodatalab_ingestion"]

[tool.hatch.build.targets.wheel.sources]
"src/geodatalab_ingestion" = "geodatalab_ingestion"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 95

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "xlwt>=1.3.0,<2",
]
